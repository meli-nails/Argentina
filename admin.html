<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7e8e7"><title>Administración | Meli Nails"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--rose:#bd7185;--rose2:#9e5369;--paper:#fffaf8;--ink:#35282d;--muted:#88777b;--line:#ecdde0;--green:#557b66;--red:#a84e5c;--shadow:0 15px 40px #7e4b5710}*{box-sizing:border-box}body{margin:0;background:#fbf3f2;color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#392b30;color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:25px}.brand{font:800 21px Manrope;letter-spacing:-1px;padding:4px 10px}.brand span{color:#e6aebb}.side nav{display:grid;gap:7px}.side nav button{border:0;text-align:left;padding:12px 14px;border-radius:11px;background:transparent;color:#eadde0;font-weight:600}.side nav button.active,.side nav button:hover{background:#ffffff18;color:white}.side .logout{margin-top:auto;background:#ffffff18;color:#fff;border:0;border-radius:11px;padding:12px}.main{padding:30px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.head h1{font:800 28px Manrope;margin:0;letter-spacing:-1px}.head p{color:var(--muted);margin:5px 0 0}.btn{border:0;background:var(--rose2);color:white;padding:10px 15px;border-radius:10px;font-weight:700}.btn.light{background:#f5e5e8;color:var(--rose2)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;font:800 25px Manrope;margin-top:8px}.panel{margin-bottom:17px;overflow:hidden}.panel h2{font:700 18px Manrope;margin:0 0 16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #f0e7e9;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}td{font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:7px 9px;border:0;border-radius:8px;background:#f5e5e8;color:var(--rose2);font-size:12px;font-weight:700}.small.green{background:#eaf3ed;color:var(--green)}.small.red{background:#fae9eb;color:var(--red)}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#f5e5e8;color:var(--rose2);font-size:11px;font-weight:700}.muted{color:var(--muted)}.empty{padding:25px;text-align:center;color:var(--muted)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 20%,#f1d9df,transparent 35%),#fbf3f2}.login{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}.login h1{font:800 26px Manrope;margin:8px 0}.login p{color:var(--muted);line-height:1.6}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:700}.field input,.field select{padding:12px;border:1px solid var(--line);border-radius:10px;width:100%}.error{color:var(--red);font-size:13px;min-height:18px}.toast{position:fixed;bottom:20px;right:20px;z-index:99;background:#35282d;color:white;padding:12px 17px;border-radius:10px;max-width:min(420px,calc(100% - 40px));display:none}.modal-back{position:fixed;inset:0;background:#24151b88;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(500px,100%);background:#fff;border-radius:18px;padding:24px;max-height:90vh;overflow:auto}.modal h2{font:800 21px Manrope;margin:0 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{padding:14px;gap:10px}.side nav{display:flex;overflow:auto}.side nav button{white-space:nowrap}.side .logout{position:absolute;right:15px;top:17px}.brand{padding:6px}.main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.head h1{font-size:23px}}
</style></head><body>
<div id="app"><div class="login-wrap"><div class="login"><div class="brand" style="color:#392b30;padding:0">Meli <span>Nails</span></div><h1>Panel de administración</h1><p>Ingresá con la cuenta autorizada para administrar el estudio.</p><form id="loginForm"><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginButton" style="width:100%">Ingresar</button><div class="error" id="loginError" role="alert"></div></form><p style="font-size:12px"><a href="index.html" style="color:#9e5369">Volver a la página pública</a></p></div></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';const SUPABASE_URL='https://vfkalbukfiyprugqepcy.supabase.co';const SUPABASE_KEY='sb_publishable_9FHk_d5tREjQPxscjkm5CA_kXTZ9tE_';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),money=v=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v)||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let admin=false,tab='Resumen',bookings=[],services=[],toastTimer;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',3500)}function statusLabel(s){return({pending:'Pendiente',confirmed:'Confirmado',completed:'Completado',cancelled:'Cancelado',rejected:'Rechazado',no_show:'Ausente'})[s]||s}
async function verifyAdmin(){const {data:{session},error}=await db.auth.getSession();if(error||!session)return false;const {data,error:ae}=await db.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(ae||!data){await db.auth.signOut();return false;}admin=true;return true;}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('loginButton');btn.disabled=true;btn.textContent='Verificando…';$('loginError').textContent='';try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;const {data:role,error:re}=await db.from('admins').select('user_id').eq('user_id',data.user.id).maybeSingle();if(re||!role){await db.auth.signOut();throw new Error('Esta cuenta no tiene permisos de administradora.');}admin=true;renderShell();await loadTab();}catch(err){$('loginError').textContent=err.message||'No se pudo iniciar sesión.';}finally{btn.disabled=false;btn.textContent='Ingresar';}});
function renderShell(){if(!admin)return;$('app').innerHTML=`<div class="layout"><aside class="side"><div class="brand">Meli <span>Nails</span></div><nav id="nav"></nav><button class="logout" id="logout">Cerrar sesión</button></aside><main class="main"><header class="head"><div><h1 id="title">Resumen</h1><p id="today"></p></div><button class="btn light" id="refresh">Actualizar</button></header><div id="content"><div class="empty">Cargando…</div></div></main></div>`;$('logout').addEventListener('click',logout);$('refresh').addEventListener('click',loadTab);}
const tabs=['Resumen','Turnos','Clientas','Servicios','Diseños','Pagos','Configuración'];function setTab(t){tab=t;loadTab();}
async function loadBookings(){const {data,error}=await db.from('bookings').select('id,public_code,service_name,design_name,starts_at,duration_min,status,price,deposit_amount,client_notes,created_at,clients(full_name,phone)').order('starts_at',{ascending:true});if(error)throw error;bookings=data||[];}
function navMarkup(){return tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');}
async function loadTab(){if(!admin)return;try{if(tab==='Resumen'||tab==='Turnos')await loadBookings();let html='';if(tab==='Resumen')html=dashboard();else if(tab==='Turnos')html=appointments();else if(tab==='Clientas')html=await clientsView();else if(tab==='Servicios')html=await servicesView();else if(tab==='Diseños')html=await designsView();else if(tab==='Pagos')html=await paymentsView();else html=await settingsView();$('nav').innerHTML=navMarkup();$('nav').querySelectorAll('button[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));$('title').textContent=tab;$('today').textContent=new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());$('content').innerHTML=html;}catch(err){console.error(err);$('content').innerHTML=`<section class="panel"><b>No se pudo cargar esta sección.</b><p class="muted">${esc(err.message||'Error desconocido')}</p></section>`;}}
function dateTime(v){return new Intl.DateTimeFormat('es-AR',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(v));}
function dashboard(){const pending=bookings.filter(b=>b.status==='pending').length,confirmed=bookings.filter(b=>b.status==='confirmed').length,today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const countToday=bookings.filter(b=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(b.starts_at))===today).length;return `<div class="grid"><div class="metric"><span>Turnos de hoy</span><strong>${countToday}</strong></div><div class="metric"><span>Pendientes</span><strong>${pending}</strong></div><div class="metric"><span>Confirmados</span><strong>${confirmed}</strong></div><div class="metric"><span>Total de turnos</span><strong>${bookings.length}</strong></div></div><section class="panel"><h2>Próximos turnos</h2>${bookingTable(bookings.filter(b=>new Date(b.starts_at)>=new Date()).slice(0,8))}</section>`;}
function bookingTable(rows){if(!rows.length)return '<div class="empty">Todavía no hay turnos registrados.</div>';return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Clienta</th><th>Servicio</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${esc(dateTime(b.starts_at))}</td><td><b>${esc(b.clients?.full_name||'Clienta')}</b><br><span class="muted">${esc(b.clients?.phone||'')}</span></td><td>${esc(b.service_name)}<br><span class="muted">${esc(b.design_name||'Sin diseño')}</span></td><td>${money(b.price)}</td><td><span class="pill">${esc(statusLabel(b.status))}</span></td><td><div class="actions">${b.status==='pending'?`<button class="small green" data-status="confirmed" data-id="${esc(b.id)}">Confirmar</button><button class="small red" data-status="rejected" data-id="${esc(b.id)}">Rechazar</button>`:b.status==='confirmed'?`<button class="small green" data-status="completed" data-id="${esc(b.id)}">Completar</button><button class="small red" data-status="cancelled" data-id="${esc(b.id)}">Cancelar</button><button class="small" data-status="no_show" data-id="${esc(b.id)}">Ausente</button>`:'—'}</div></td></tr>`).join('')}</tbody></table></div>`;}
function appointments(){return `<section class="panel"><h2>Agenda de turnos</h2>${bookingTable(bookings)}</section>`;}
$('app').addEventListener('click',async e=>{const b=e.target.closest('button[data-status]');if(!b)return;const id=b.dataset.id,next=b.dataset.status;if(!confirm(`¿Cambiar el estado del turno a «${statusLabel(next)}»?`))return;b.disabled=true;const {error}=await db.from('bookings').update({status:next}).eq('id',id);if(error){toast(error.message);b.disabled=false;return;}toast('Estado actualizado.');await loadTab();});
async function clientsView(){const {data,error}=await db.from('clients').select('id,full_name,phone,email,created_at').order('created_at',{ascending:false});if(error)throw error;return `<section class="panel"><h2>Clientas registradas</h2>${data?.length?`<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Registro</th></tr></thead><tbody>${data.map(c=>`<tr><td>${esc(c.full_name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email||'—')}</td><td>${esc(new Date(c.created_at).toLocaleDateString('es-AR'))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay clientas registradas.</div>'}</section>`;}
async function servicesView(){const {data,error}=await db.from('services').select('id,name,description,price,duration_min,is_active,sort_order').order('sort_order');if(error)throw error;services=data||[];return `<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>Servicios</h2><button class="btn" id="addService">Agregar servicio</button></div><div class="table-wrap"><table><thead><tr><th>Servicio</th><th>Precio</th><th>Duración</th><th>Estado</th><th></th></tr></thead><tbody>${services.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class="muted">${esc(s.description||'')}</span></td><td>${money(s.price)}</td><td>${Number(s.duration_min)} min</td><td>${s.is_active?'Activo':'Oculto'}</td><td><button class="small" data-edit-service="${esc(s.id)}">Editar</button></td></tr>`).join('')}</tbody></table></div></section>`;}
$('app').addEventListener('click',e=>{if(e.target.id==='addService')serviceModal(null);const b=e.target.closest('[data-edit-service]');if(b)serviceModal(services.find(s=>s.id===b.dataset.editService));});
function serviceModal(s){const x=s||{name:'',description:'',price:0,duration_min:60,is_active:true};const back=document.createElement('div');back.className='modal-back';back.innerHTML=`<form class="modal" id="serviceForm"><h2>${s?'Editar servicio':'Nuevo servicio'}</h2><div class="field"><label>Nombre</label><input name="name" maxlength="100" required value="${esc(x.name)}"></div><div class="field"><label>Descripción</label><input name="description" maxlength="250" value="${esc(x.description||'')}"></div><div class="field"><label>Precio (ARS)</label><input name="price" type="number" min="0" step="1" required value="${Number(x.price)}"></div><div class="field"><label>Duración (minutos)</label><input name="duration_min" type="number" min="15" max="480" required value="${Number(x.duration_min)}"></div><div class="field"><label><input name="is_active" type="checkbox" ${x.is_active?'checked':''}> Servicio activo</label></div><div class="modal-actions"><button type="button" class="btn light" id="closeModal">Cancelar</button><button class="btn">Guardar</button></div></form>`;document.body.append(back);back.addEventListener('click',e=>{if(e.target===back||e.target.id==='closeModal')back.remove();});back.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),payload={name:String(f.get('name')).trim(),description:String(f.get('description')||'').trim(),price:Number(f.get('price')),duration_min:Number(f.get('duration_min')),is_active:f.get('is_active')==='on'};if(!payload.name||!Number.isFinite(payload.price)||payload.price<0||payload.duration_min<15){toast('Revisá los datos del servicio.');return;}const q=s?db.from('services').update(payload).eq('id',s.id):db.from('services').insert({...payload,sort_order:services.length+1});const {error}=await q;if(error){toast(error.message);return;}back.remove();toast('Servicio guardado.');await loadTab();});}
async function designsView(){const {data,error}=await db.from('designs').select('id,name,description,category,extra_price,image_url,is_sample,is_available').order('created_at',{ascending:false});if(error)throw error;return `<section class="panel"><h2>Diseños cargados</h2>${data?.length?`<div class="table-wrap"><table><thead><tr><th>Diseño</th><th>Categoría</th><th>Adicional</th><th>Estado</th></tr></thead><tbody>${data.map(d=>`<tr><td>${esc(d.name)}${d.is_sample?' <span class="pill">Muestra</span>':''}</td><td>${esc(d.category||'—')}</td><td>${money(d.extra_price)}</td><td>${d.is_available?'Disponible':'Oculto'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay diseños cargados.</div>'}</section>`;}
async function paymentsView(){const {data,error}=await db.from('payments').select('id,kind,amount,status,method,paid_at,created_at,clients(full_name)').order('created_at',{ascending:false});if(error)throw error;const paid=(data||[]).filter(p=>p.status==='recibido').reduce((n,p)=>n+Number(p.amount),0),pending=(data||[]).filter(p=>p.status==='pendiente').reduce((n,p)=>n+Number(p.amount),0);return `<div class="grid"><div class="metric"><span>Ingresos recibidos</span><strong>${money(paid)}</strong></div><div class="metric"><span>Pagos pendientes</span><strong>${money(pending)}</strong></div></div><section class="panel"><h2>Movimientos</h2>${data?.length?`<div class="table-wrap"><table><thead><tr><th>Clienta</th><th>Concepto</th><th>Importe</th><th>Estado</th><th>Fecha</th><th>Medio</th><th>Acción</th></tr></thead><tbody>${data.map(p=>`<tr><td>${esc(p.clients?.full_name||'—')}</td><td>${esc(p.kind)}</td><td>${money(p.amount)}</td><td>${esc(p.status)}</td><td>${esc(new Date(p.created_at).toLocaleDateString('es-AR'))}</td><td>${esc(p.method||'—')}</td><td>${p.status==='pendiente'?`<select id="method-${esc(p.id)}"><option value="">Método</option><option value="efectivo">Efectivo</option><option value="transferencia">Transferencia</option><option value="mercado_pago">Mercado Pago</option><option value="otro">Otro</option></select> <button class="small green" data-pay="${esc(p.id)}">Recibido</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay pagos registrados.</div>'}</section>`;}
$('app').addEventListener('click',async e=>{const b=e.target.closest('[data-pay]');if(!b)return;const id=b.dataset.pay,method=$(`method-${id}`)?.value;if(!method){toast('Elegí un medio de pago.');return;}b.disabled=true;const {error}=await db.from('payments').update({status:'recibido',method,paid_at:new Date().toISOString()}).eq('id',id).eq('status','pendiente');if(error){toast(error.message);b.disabled=false;return;}toast('Pago marcado como recibido.');await loadTab();});
async function settingsView(){const {data,error}=await db.from('business_settings').select('*').eq('id',1).single();if(error)throw error;return `<section class="panel"><h2>Configuración del estudio</h2><p><b>Zona horaria:</b> ${esc(data.timezone)}</p><p><b>Porcentaje de seña:</b> ${Number(data.deposit_percent)}%</p><p><b>Anticipación mínima:</b> ${Number(data.min_notice_hours)} horas</p><p><b>Anticipación máxima:</b> ${Number(data.max_advance_days)} días</p><p><b>WhatsApp:</b> ${esc(data.whatsapp_phone||'Sin configurar')}</p><p><b>Alias de pago:</b> ${esc(data.payment_alias||'Sin configurar')}</p><p class="muted">La configuración se muestra en modo lectura para evitar modificar accidentalmente parámetros operativos de reservas.</p></section>`;}
async function logout(){await db.auth.signOut();admin=false;location.reload();}
(async()=>{try{if(await verifyAdmin()){renderShell();await loadTab();}}catch(e){console.error(e);}})();
</script></body></html>
